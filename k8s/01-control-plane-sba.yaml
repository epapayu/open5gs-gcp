          volumeMounts:
            - name: sba-configs
              mountPath: /etc/open5gs-cfg
      volumes:
        - name: sba-configs
          configMap:
            name: open5gs-sba-configs
---
# 2B. Cloud Firestore MongoDB Wire-Protocol Adapter (Bridges legacy libmongoc/Mongoose OP_QUERY to Firestore TLS loadBalanced=true)
apiVersion: v1
kind: ConfigMap
metadata:
  name: open5gs-firestore-proxy-script
  namespace: open5gs
data:
  proxy.js: |
    const net = require("net");
    const tls = require("tls");
    const bson = require("/opt/open5gs-webui/node_modules/bson");

    const rawUri = process.env.DB_URI || "";
    const host = new URL(rawUri.replace(/^mongodb(\+srv)?:\/\//, "http://")).hostname;
    if (!host) {
      console.error("FATAL: Could not parse Cloud Firestore hostname from DB_URI");
      process.exit(1);
    }

    function makeOpMsg(reqId, respTo, obj) {
      const doc = bson.serialize(obj);
      const h = Buffer.alloc(21);
      h.writeInt32LE(21 + doc.length, 0);
      h.writeInt32LE(reqId, 4);
      h.writeInt32LE(respTo, 8);
      h.writeInt32LE(2013, 12);
      h.writeUInt32LE(0, 16);
      h[20] = 0;
      return Buffer.concat([h, doc]);
    }

    function makeOpReply(reqId, respTo, obj) {
      const doc = bson.serialize(obj);
      const h = Buffer.alloc(36);
      h.writeInt32LE(36 + doc.length, 0);
      h.writeInt32LE(reqId, 4);
      h.writeInt32LE(respTo, 8);
      h.writeInt32LE(1, 12);
      h.writeInt32LE(8, 16);
      h.writeBigInt64LE(0n, 20);
      h.writeInt32LE(0, 28);
      h.writeInt32LE(1, 32);
      return Buffer.concat([h, doc]);
    }

    const server = net.createServer((client) => {
      client.setNoDelay(true);
      const pending = new Map();
      const upstream = tls.connect(443, host, { servername: host });
      upstream.setNoDelay(true);

      let cBuf = Buffer.alloc(0);
      let uBuf = Buffer.alloc(0);

      client.on("data", (chunk) => {
        cBuf = Buffer.concat([cBuf, chunk]);
        while (cBuf.length >= 4 && cBuf.length >= cBuf.readInt32LE(0)) {
          const len = cBuf.readInt32LE(0);
          const frame = cBuf.slice(0, len);
          cBuf = cBuf.slice(len);

          const reqId = frame.readInt32LE(4);
          const op = frame.readInt32LE(12);

          if (op === 2004) {
            try {
              let off = 20;
              while (off < frame.length && frame[off] !== 0) off++;
              const docStart = off + 9;
              const docLen = frame.readInt32LE(docStart);
              const q = bson.deserialize(frame.slice(docStart, docStart + docLen));
              const cmd = { hello: 1, loadBalanced: true, $db: "admin" };
              if (q.saslSupportedMechs) cmd.saslSupportedMechs = q.saslSupportedMechs;
              pending.set(reqId, "OP_QUERY");
              upstream.write(makeOpMsg(reqId, 0, cmd));
              continue;
            } catch (err) {
              // Fall through to forward unmodified if unexpected OP_QUERY
            }
          } else if (op === 2013 && frame[20] === 0 && frame.length >= 25) {
            try {
              const sec0Len = frame.readInt32LE(21);
              if (21 + sec0Len <= frame.length) {
                const q = bson.deserialize(frame.slice(21, 21 + sec0Len));
                if (q.ismaster || q.isMaster || q.hello) {
                  const cmd = { hello: 1, loadBalanced: true, $db: q.$db || "admin" };
                  if (q.saslSupportedMechs) cmd.saslSupportedMechs = q.saslSupportedMechs;
                  pending.set(reqId, "OP_MSG");
                  upstream.write(makeOpMsg(reqId, 0, cmd));
                  continue;
                }
              }
            } catch (err) {
              // Forward unmodified
            }
          }
          upstream.write(frame);
        }
      });

      upstream.on("data", (chunk) => {
        uBuf = Buffer.concat([uBuf, chunk]);
        while (uBuf.length >= 4 && uBuf.length >= uBuf.readInt32LE(0)) {
          const len = uBuf.readInt32LE(0);
          const frame = uBuf.slice(0, len);
          uBuf = uBuf.slice(len);

          const reqId = frame.readInt32LE(4);
          const respTo = frame.readInt32LE(8);
          const op = frame.readInt32LE(12);
          const mode = pending.get(respTo);

          if (mode && op === 2013 && frame[20] === 0) {
            pending.delete(respTo);
            const sec0Len = frame.readInt32LE(21);
            const r = bson.deserialize(frame.slice(21, 21 + sec0Len), { promoteValues: false });
            r.ismaster = true;
            r.minWireVersion = 0;
            r.maxWireVersion = 9;
            delete r.serviceId;
            client.write(mode === "OP_QUERY" ? makeOpReply(reqId, respTo, r) : makeOpMsg(reqId, respTo, r));
          } else {
            client.write(frame);
          }
        }
      });

      client.on("error", () => upstream.destroy());
      upstream.on("error", () => client.destroy());
      client.on("close", () => upstream.destroy());
      upstream.on("close", () => client.destroy());
    });

    server.listen(27017, "0.0.0.0", () => {
      console.log(`Cloud Firestore MongoDB Wire-Protocol Adapter listening on :27017 -> ${host}:443 (TLS + loadBalanced=true)`);
    });
---
apiVersion: v1
kind: Service
metadata:
  name: open5gs-firestore-proxy
  namespace: open5gs
spec:
  selector:
    app: open5gs-firestore-proxy
  ports:
    - name: mongodb
      port: 27017
      targetPort: 27017
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: open5gs-firestore-proxy
  namespace: open5gs
  labels:
    app.kubernetes.io/part-of: open5gs-5gc
    app: open5gs-firestore-proxy
spec:
  replicas: 2
  selector:
    matchLabels:
      app: open5gs-firestore-proxy
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: open5gs-5gc
        app: open5gs-firestore-proxy
    spec:
      nodeSelector:
        5g-plane: control-plane-sba
      containers:
        - name: proxy
          image: docker.io/gradiant/open5gs-webui:2.7.2
          command: ["node", "/etc/firestore-proxy/proxy.js"]
          env:
            - name: DB_URI
              valueFrom:
                secretKeyRef:
                  name: open5gs-db-secret
                  key: db_uri
          ports:
            - containerPort: 27017
              name: mongodb
          readinessProbe:
            tcpSocket:
              port: 27017
            initialDelaySeconds: 2
            periodSeconds: 5
          volumeMounts:
            - name: proxy-script
              mountPath: /etc/firestore-proxy
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
      volumes:
        - name: proxy-script
          configMap:
            name: open5gs-firestore-proxy-script
---
# 3. UDR (Unified Data Repository - Connected to Cloud Firestore MongoDB Compat)
apiVersion: v1
kind: Service
metadata:
  name: open5gs-udr
  namespace: open5gs
spec:
  selector:
    nf: udr
  ports:
    - name: http2-sbi
      port: 7777
      targetPort: 7777
      appProtocol: kubernetes.io/h2c
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: open5gs-udr
  namespace: open5gs
  labels:
    app.kubernetes.io/part-of: open5gs-5gc
    nf: udr
spec:
  replicas: 2
  selector:
    matchLabels:
      nf: udr
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: open5gs-5gc
        nf: udr
    spec:
      nodeSelector:
        5g-plane: control-plane-sba
      containers:
        - name: udrd
          image: docker.io/gradiant/open5gs:2.7.2
          command:
            - /bin/bash
            - -c
            - |
              set -e
              ulimit -n 65536
              export DB_URI="$(printf '%s' "${DB_URI}" | sed -E 's#@[^/]+/#@open5gs-firestore-proxy.open5gs.svc.cluster.local:27017/#; s#\?.*#?authSource=admin\&authMechanism=SCRAM-SHA-256\&retryWrites=false#')"
              printf 'db_uri: "%s"\n' "${DB_URI}" > /tmp/udr.yaml
              cat /etc/open5gs-cfg/udr.yaml >> /tmp/udr.yaml
              exec open5gs-udrd -c /tmp/udr.yaml
          env:
            - name: DB_URI
              valueFrom:
                secretKeyRef:
                  name: open5gs-db-secret
                  key: db_uri
          ports:
            - containerPort: 7777
              name: sbi
          volumeMounts:
            - name: sba-configs
              mountPath: /etc/open5gs-cfg
      volumes:
        - name: sba-configs
          configMap:
            name: open5gs-sba-configs
---
