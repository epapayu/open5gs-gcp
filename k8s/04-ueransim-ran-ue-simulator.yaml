# ==============================================================================
# 04-ueransim-ran-ue-simulator.yaml
# End-to-End 5G Standalone (5G SA) Simulation Suite on GKE
# Includes:
#   1. UERANSIM gNodeB Simulator (Multi-NIC: eth0=NR-Uu Radio, net1=N2 SCTP, net2=N3 GTP-U)
#   2. UERANSIM UE Simulator (Creates uesimtun0 interface for live E2E PDU traffic)
#   3. Open5GS Live 5G SA SBA & NRF Conformance Verification Job
# ==============================================================================

apiVersion: v1
kind: ConfigMap
metadata:
  name: ueransim-gnb-config
  namespace: open5gs
data:
  gnb.yaml: |
    mcc: '999'
    mnc: '70'
    nci: '0x000000010'
    idLength: 32
    tac: 1

    # Virtual NR-Uu radio link IP (eth0 Pod IP on vpc-sbi-mgmt)
    linkIp: __RADIO_IP__
    # N2 Interface IP (Populated at runtime from net1 on vpc-n2-signaling)
    ngapIp: __NGAP_IP__
    # N3 Interface IP (Populated at runtime from net2 on vpc-n3-userplane)
    gtpIp: __GTP_IP__

    # Target Open5GS AMF N2 SCTP Endpoint
    amfConfigs:
      - address: __AMF_N2_IP__
        port: 38412

    slices:
      - sst: 1
        sd: '0x010203'

    ignoreStreamIds: true
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ueransim-ue-config
  namespace: open5gs
data:
  ue.yaml: |
    supi: 'imsi-999700000000001'
    mcc: '999'
    mnc: '70'
    protectionScheme: 0
    homeNetworkPublicKey: '5a8d38864820197c3394b92613b20b91633cbd897119273bf8e4a6f4eec0a650'
    homeNetworkPublicKeyId: 1
    routingIndicator: '0000'

    # Matches Subscriber provisioned via open5gs-dbctl in Cloud Firestore
    key: '465B5CE8B199B49FAA5F0A2EE238A6BC'
    op: 'E8ED289DEBA952E4283B54E88E6183CA'
    opType: 'OPC'
    amf: '8000'
    imei: '356938035643803'
    imeiSv: '4370816125816151'

    # Simulated NR-Uu link resolved at startup from ueransim-gnb Service
    gnbSearchList:
      - __GNB_IP__

    uacAic:
      mps: false
      mcs: false

    uacAcc:
      normalClass: 0
      class11: false
      class12: false
      class13: false
      class14: false
      class15: false

    sessions:
      - type: 'IPv4'
        apn: 'internet'
        slice:
          sst: 1
          sd: '0x010203'

    configured-nssai:
      - sst: 1
        sd: '0x010203'

    default-nssai:
      - sst: 1
        sd: '0x010203'

    integrity:
      IA1: true
      IA2: true
      IA3: true

    ciphering:
      EA1: true
      EA2: true
      EA3: true

    integrityMaxRate:
      uplink: 'full'
      downlink: 'full'
---
# 1. Service for Simulated NR-Uu Radio Interface (UE <-> gNodeB over UDP :4997)
apiVersion: v1
kind: Service
metadata:
  name: ueransim-gnb
  namespace: open5gs
spec:
  selector:
    app: ueransim-gnb
  ports:
    - name: rls-radio-udp
      port: 4997
      targetPort: 4997
      protocol: UDP
---
# 2. UERANSIM 5G gNodeB Simulator (Multi-NIC attached to N2 SCTP and N3 GTP-U)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ueransim-gnb
  namespace: open5gs
  labels:
    app.kubernetes.io/part-of: open5gs-5gc
    app: ueransim-gnb
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ueransim-gnb
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: open5gs-5gc
        app: ueransim-gnb
      annotations:
        networking.gke.io/default-interface: "eth0"
        networking.gke.io/interfaces: |
          [
            {"interfaceName":"eth0","network":"default"},
            {"interfaceName":"net1","network":"n2-signaling-net"},
            {"interfaceName":"net2","network":"n3-userplane-net"}
          ]
    spec:
      nodeSelector:
        5g-plane: multinic-dataplane
      containers:
        - name: nr-gnb
          image: docker.io/gradiant/ueransim:3.2.6
          command:
            - /bin/bash
            - -c
            - |
              set -e
              RADIO_IP=$(ip -4 addr show dev eth0 | awk '/inet / {split($2,a,"/"); print a[1]; exit}')
              NGAP_IP=$(ip -4 addr show dev net1 | awk '/inet / {split($2,a,"/"); print a[1]; exit}')
              GTP_IP=$(ip -4 addr show dev net2 | awk '/inet / {split($2,a,"/"); print a[1]; exit}')
              cp /etc/ueransim-cfg/gnb.yaml /tmp/gnb.yaml
              sed -i "s/__RADIO_IP__/${RADIO_IP}/g" /tmp/gnb.yaml
              sed -i "s/__NGAP_IP__/${NGAP_IP}/g" /tmp/gnb.yaml
              sed -i "s/__GTP_IP__/${GTP_IP}/g" /tmp/gnb.yaml
              sed -i "s/__AMF_N2_IP__/${AMF_N2_ADDRESS}/g" /tmp/gnb.yaml
              echo "Starting UERANSIM gNodeB: RADIO=${RADIO_IP}, N2=${NGAP_IP} -> AMF=${AMF_N2_ADDRESS}:38412, N3=${GTP_IP}"
              exec nr-gnb -c /tmp/gnb.yaml
          envFrom:
            - configMapRef:
                name: open5gs-dataplane-endpoints
          ports:
            - containerPort: 4997
              name: rls-radio-udp
              protocol: UDP
            - containerPort: 2152
              name: n3-gtpu
              protocol: UDP
          volumeMounts:
            - name: gnb-config
              mountPath: /etc/ueransim-cfg
      volumes:
        - name: gnb-config
          configMap:
            name: ueransim-gnb-config
---
# 3. UERANSIM 5G UE Simulator (Establishes PDU session & creates uesimtun0)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ueransim-ue
  namespace: open5gs
  labels:
    app.kubernetes.io/part-of: open5gs-5gc
    app: ueransim-ue
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ueransim-ue
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: open5gs-5gc
        app: ueransim-ue
    spec:
      nodeSelector:
        5g-plane: control-plane-sba
      containers:
        - name: nr-ue
          image: docker.io/gradiant/ueransim:3.2.6
          command:
            - /bin/bash
            - -c
            - |
              set -e
              until GNB_IP=$(getent hosts ueransim-gnb.open5gs.svc.cluster.local | awk '{print $1; exit}') && [ -n "${GNB_IP}" ]; do
                echo "Waiting for ueransim-gnb DNS..."
                sleep 2
              done
              cp /etc/ueransim-cfg/ue.yaml /tmp/ue.yaml
              sed -i "s/__GNB_IP__/${GNB_IP}/g" /tmp/ue.yaml
              echo "Starting UERANSIM UE targeting gNodeB ${GNB_IP}..."
              exec nr-ue -c /tmp/ue.yaml
          securityContext:
            runAsUser: 0
            privileged: true
            capabilities:
              add:
                - NET_ADMIN
          volumeMounts:
            - name: ue-config
              mountPath: /etc/ueransim-cfg
            - name: dev-net-tun
              mountPath: /dev/net/tun
            - name: host-ca-certs
              mountPath: /etc/ssl/certs
              readOnly: true
      volumes:
        - name: ue-config
          configMap:
            name: ueransim-ue-config
        - name: dev-net-tun
          hostPath:
            path: /dev/net/tun
            type: CharDevice
        - name: host-ca-certs
          hostPath:
            path: /etc/ssl/certs
            type: Directory
---
# 4. Live 5G SA Control Plane SBA / NRF NF-Discovery Conformance Verification Job
apiVersion: batch/v1
kind: Job
metadata:
  name: open5gs-native-5gc-conformance-test
  namespace: open5gs
  labels:
    app.kubernetes.io/part-of: open5gs-5gc
spec:
  backoffLimit: 2
  template:
    spec:
      restartPolicy: OnFailure
      nodeSelector:
        5g-plane: control-plane-sba
      containers:
        - name: open5gs-test-runner
          image: docker.io/gradiant/open5gs:2.7.2
          command:
            - /bin/bash
            - -c
            - |
              set -e
              echo "Querying Open5GS NRF HTTP/2 SBI NF-Management Registry..."
              RESP=$(curl -sS --http2-prior-knowledge http://open5gs-nrf.open5gs.svc.cluster.local:7777/nnrf-nfm/v1/nf-instances)
              echo "${RESP}"
              for pair in SCP:AMF UDR:UDM UDM:AMF AUSF:AMF PCF:AMF NSSF:AMF BSF:PCF SEPP:AMF AMF:AMF SMF:AMF; do
                nf="${pair%%:*}"
                req="${pair##*:}"
                echo "Checking 3GPP TS 29.510 NRF NF-Discovery for ${nf} (requester=${req})..."
                curl -sS --http2-prior-knowledge \
                  "http://open5gs-nrf.open5gs.svc.cluster.local:7777/nnrf-disc/v1/nf-instances?target-nf-type=${nf}&requester-nf-type=${req}" | grep -q "\"nfType\":\"${nf}\""
                echo "  [OK] ${nf} discovered & REGISTERED in NRF HTTP/2 SBI!"
              done
              echo "All 3GPP 5G SA SBA Network Functions verified in NRF!"
