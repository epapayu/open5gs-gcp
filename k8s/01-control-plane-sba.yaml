# 6. AMF (Access and Mobility Management Function - Multi-NIC: eth0=SBI/N26, net1=N2 SCTP)
apiVersion: v1
kind: Service
metadata:
  name: open5gs-amf
  namespace: open5gs
spec:
  clusterIP: None
  selector:
    nf: amf
  ports:
    - name: http2-sbi
      port: 7777
      targetPort: 7777
      appProtocol: kubernetes.io/h2c
    - name: n26-gtpc
      port: 2123
      targetPort: 2123
      protocol: UDP
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: open5gs-amf
  namespace: open5gs
spec:
  serviceName: open5gs-amf
  replicas: 1
  selector:
    matchLabels:
      nf: amf
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: open5gs-5gc
        nf: amf
        metrics: enabled
      annotations:
        networking.gke.io/default-interface: "eth0"
        networking.gke.io/interfaces: |
          [
            {"interfaceName":"eth0","network":"default"},
            {"interfaceName":"net1","network":"n2-signaling-net"}
          ]
    spec:
      nodeSelector:
        5g-plane: multinic-dataplane
      containers:
        - name: amfd
          image: docker.io/gradiant/open5gs:2.7.2
          command: ["/bin/bash", "-c", "ulimit -n 65536 && exec open5gs-amfd -c /etc/open5gs-cfg/amf.yaml"]
          ports:
            - containerPort: 7777
              name: sbi
              protocol: TCP
            - containerPort: 38412
              name: n2-ngap-sctp
              protocol: SCTP
            - containerPort: 2123
              name: n26-gtpc
              protocol: UDP
            - containerPort: 9090
              name: metrics
              protocol: TCP
          volumeMounts:
            - name: sba-configs
              mountPath: /etc/open5gs-cfg
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "2000m"
              memory: "2Gi"
      volumes:
        - name: sba-configs
          configMap:
            name: open5gs-sba-configs
---
# 7. SMF + PGW-C (Session Management Function - Multi-NIC: eth0=SBI/S5c/Gx, net1=N4 PFCP)
apiVersion: v1
kind: Service
metadata:
  name: open5gs-smf
  namespace: open5gs
spec:
  clusterIP: None
  selector:
    nf: smf
  ports:
    - name: http2-sbi
      port: 7777
      targetPort: 7777
      appProtocol: kubernetes.io/h2c
    - name: s5c-gtpc
      port: 2123
      targetPort: 2123
      protocol: UDP
    - name: gx-diameter
      port: 3868
      targetPort: 3868
      protocol: TCP
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: open5gs-smf
  namespace: open5gs
spec:
  serviceName: open5gs-smf
  replicas: 1
  selector:
    matchLabels:
      nf: smf
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: open5gs-5gc
        nf: smf
        metrics: enabled
      annotations:
        networking.gke.io/default-interface: "eth0"
        networking.gke.io/interfaces: |
          [
            {"interfaceName":"eth0","network":"default"},
            {"interfaceName":"net1","network":"n4-pfcp-net"}
          ]
    spec:
      nodeSelector:
        5g-plane: multinic-dataplane
      containers:
        - name: smfd
          image: docker.io/gradiant/open5gs:2.7.2
          command:
            - /bin/bash
            - -c
            - |
              set -e
              ulimit -n 65536
              sed "s/__UPF_N4_ADDRESS__/${UPF_N4_ADDRESS}/g" /etc/open5gs-cfg/smf.yaml > /tmp/smf.yaml
              exec open5gs-smfd -c /tmp/smf.yaml
          envFrom:
            - configMapRef:
                name: open5gs-dataplane-endpoints
          ports:
            - containerPort: 7777
              name: sbi
              protocol: TCP
            - containerPort: 8805
              name: n4-pfcp
              protocol: UDP
            - containerPort: 9090
              name: metrics
              protocol: TCP
          volumeMounts:
            - name: sba-configs
              mountPath: /etc/open5gs-cfg
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "2000m"
              memory: "2Gi"
      volumes:
        - name: sba-configs
          configMap:
            name: open5gs-sba-configs
---
