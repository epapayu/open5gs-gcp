# ==============================================================================
# 03-nms-webui-iap.yaml
# Network Management System (NMS) - Open5GS WebUI
# Secured via Google Cloud External ALB + Cloud Armor (+ IAP Ready)
# Connected to Cloud Firestore (MongoDB Compat) & Cloud Memorystore (Valkey/Redis)
# ==============================================================================
apiVersion: cloud.google.com/v1
kind: BackendConfig
metadata:
  name: open5gs-webui-iap-config
  namespace: open5gs
spec:
  # Attach Google Cloud Armor WAF policy (provisioned via Terraform)
  securityPolicy:
    name: "open5gs-nms-cloud-armor-policy"
  # Cookie-based session affinity for Express connect.sid + Lusca CSRF tokens
  sessionAffinity:
    affinityType: "GENERATED_COOKIE"
    affinityCookieTtlSec: 86400
  # Note: Enable IAP below once an OAuth 2.0 Client Secret (open5gs-iap-oauth-secret)
  # and custom domain ManagedCertificate are configured:
  # iap:
  #   enabled: true
  #   oauthclientCredentials:
  #     secretName: open5gs-iap-oauth-secret
  healthCheck:
    checkIntervalSec: 15
    timeoutSec: 5
    type: HTTP
    port: 9999
    requestPath: /
---
apiVersion: v1
kind: Service
metadata:
  name: open5gs-webui-svc
  namespace: open5gs
  annotations:
    cloud.google.com/backend-config: '{"default": "open5gs-webui-iap-config"}'
    cloud.google.com/neg: '{"ingress": true}'
spec:
  type: ClusterIP
  selector:
    app: open5gs-webui
  ports:
    - name: http-webui
      port: 9999
      targetPort: 9999
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: open5gs-webui
  namespace: open5gs
  labels:
    app.kubernetes.io/part-of: open5gs-5gc
    app: open5gs-webui
spec:
  replicas: 1
  selector:
    matchLabels:
      app: open5gs-webui
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: open5gs-5gc
        app: open5gs-webui
    spec:
      nodeSelector:
        5g-plane: control-plane-sba
      containers:
        - name: webui
          image: docker.io/gradiant/open5gs-webui:2.7.2
          workingDir: /opt/open5gs-webui
          command:
            - /bin/sh
            - -c
            - |
              export DB_URI="$(printf '%s' "${DB_URI}" | sed -E 's#@[^/]+/#@open5gs-firestore-proxy.open5gs.svc.cluster.local:27017/#; s#\?.*#?authSource=admin\&authMechanism=SCRAM-SHA-256\&retryWrites=false#')"
              export NODE_PATH="/opt/open5gs-webui/node_modules"
              node -e '
                const fs = require("fs");
                let s = fs.readFileSync("/opt/open5gs-webui/server/index.js", "utf8");
                s = s.replace("serverSelectionTimeoutMS: 1000", "serverSelectionTimeoutMS: 15000");
                s = s.replace("if (dev) {\n    Account.count", "if (true) {\n    Account.count");
                s = s.replace("./routes", "/opt/open5gs-webui/server/routes");
                s = s.replace("./models/account.js", "/opt/open5gs-webui/server/models/account.js");
                fs.writeFileSync("/tmp/index.js", s);
              '
              exec node /tmp/index.js
          env:
            - name: DB_URI
              valueFrom:
                secretKeyRef:
                  name: open5gs-db-secret
                  key: db_uri
            - name: REDIS_URI
              valueFrom:
                secretKeyRef:
                  name: open5gs-redis-secret
                  key: redis_uri
            - name: HOSTNAME
              value: "0.0.0.0"
            - name: PORT
              value: "9999"
          ports:
            - containerPort: 9999
              name: http-webui
          readinessProbe:
            httpGet:
              path: /
              port: 9999
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: open5gs-nms-ingress
  namespace: open5gs
  annotations:
    kubernetes.io/ingress.class: "gce"
    # Uncomment once DNS points to Ingress VIP:
    # networking.gke.io/managed-certificates: "open5gs-nms-managed-cert"
    # kubernetes.io/ingress.allow-http: "false"
spec:
  defaultBackend:
    service:
      name: open5gs-webui-svc
      port:
        number: 9999
