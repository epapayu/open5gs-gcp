# ==============================================================================
# 01-control-plane-sba.yaml
# Open5GS 5G Standalone (5G SA) Service-Based Architecture (SBA) Control Plane
# Includes: NRF, SCP, UDR, UDM, AUSF, PCF, NSSF, BSF, SEPP, AMF (Multi-NIC),
#           SMF (Multi-NIC), and Google Cloud Managed Prometheus PodMonitoring
# ==============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: open5gs-common-env
  namespace: open5gs
data:
  PLMN_MCC: "999"
  PLMN_MNC: "70"
  TAC: "1"
  NRF_SBI_URI: "http://open5gs-nrf.open5gs.svc.cluster.local:7777"
  SCP_SBI_URI: "http://open5gs-scp.open5gs.svc.cluster.local:7777"
---
# 1. NRF (NF Repository Function)
apiVersion: v1
kind: Service
metadata:
  name: open5gs-nrf
  namespace: open5gs
spec:
  selector:
    nf: nrf
  ports:
    - name: http2-sbi
      port: 7777
      targetPort: 7777
      appProtocol: kubernetes.io/h2c
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: open5gs-nrf
  namespace: open5gs
  labels:
    app.kubernetes.io/part-of: open5gs-5gc
    nf: nrf
spec:
  replicas: 2
  selector:
    matchLabels:
      nf: nrf
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: open5gs-5gc
        nf: nrf
    spec:
      nodeSelector:
        5g-plane: control-plane-sba
      containers:
        - name: nrfd
          image: ghcr.io/open5gs/open5gs:v2.7.2
          command: ["open5gs-nrfd", "-c", "/etc/open5gs/nrf.yaml"]
          ports:
            - containerPort: 7777
              name: sbi
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "512Mi"
---
