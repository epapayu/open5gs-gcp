---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: open5gs-udr
  namespace: open5gs
  labels:
    app.kubernetes.io/part-of: open5gs-5gc
    nf: udr
spec:
  replicas: 2
  selector:
    matchLabels:
      nf: udr
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: open5gs-5gc
        nf: udr
    spec:
      nodeSelector:
        5g-plane: control-plane-sba
      containers:
        - name: udrd
          image: ghcr.io/open5gs/open5gs:v2.7.2
          command: ["open5gs-udrd", "-c", "/etc/open5gs/udr.yaml"]
          env:
            - name: DB_URI
              valueFrom:
                secretKeyRef:
                  name: open5gs-db-secret
                  key: db_uri
          ports:
            - containerPort: 7777
              name: sbi
