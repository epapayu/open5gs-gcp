# 5. SGW-U (Serving Gateway User Plane - S1-U/S5u GTP-U :2152 & Sxa PFCP :8805)
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: open5gs-sgwu
  namespace: open5gs
  labels:
    app.kubernetes.io/part-of: open5gs-5gc
    nf: sgwu
spec:
  serviceName: open5gs-sgwu
  replicas: 2
  selector:
    matchLabels:
      nf: sgwu
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: open5gs-5gc
        nf: sgwu
      annotations:
        networking.gke.io/interfaces: |
          [
            {"interfaceName":"eth0","network":"default"},
            {"interfaceName":"net1","network":"n3-userplane-net"},
            {"interfaceName":"net2","network":"n4-pfcp-net"}
          ]
    spec:
      nodeSelector:
        5g-plane: multinic-dataplane
      containers:
        - name: sgwud
          image: ghcr.io/open5gs/open5gs:v2.7.2
          command: ["open5gs-sgwud", "-c", "/etc/open5gs/sgwu.yaml"]
          ports:
            - containerPort: 2152
              name: s1u-s5u-gtpu
              protocol: UDP
            - containerPort: 8805
              name: sxa-pfcp
              protocol: UDP
---
# 6. open5gs-dbctl Automated Subscriber & Slice CLI Provisioning Job
# Implements misc/db/open5gs-dbctl to seed initial subscribers & slices into Firestore/MongoDB
apiVersion: batch/v1
kind: Job
metadata:
  name: open5gs-dbctl-subscriber-seed
  namespace: open5gs
  labels:
    app.kubernetes.io/part-of: open5gs-5gc
spec:
  backoffLimit: 2
  template:
    spec:
      restartPolicy: OnFailure
      nodeSelector:
        5g-plane: control-plane-sba
      containers:
        - name: open5gs-dbctl
          image: ghcr.io/open5gs/open5gs:v2.7.2
          command:
            - /bin/sh
            - -c
            - |
              set -e
              echo "Provisioning initial 5G SA / 4G EPC test subscriber via open5gs-dbctl..."
              open5gs-dbctl --db_uri="${DB_URI}" add_ue_with_slice \
                999700000000001 \
                465B5CE8B199B49FAA5F0A2EE238A6BC \
                E8ED289DEBA952E4283B54E88E6183CA \
                internet \
                1 \
                010203
              open5gs-dbctl --db_uri="${DB_URI}" showpretty
          env:
            - name: DB_URI
              valueFrom:
                secretKeyRef:
                  name: open5gs-db-secret
                  key: db_uri
