# ==============================================================================
# 01-control-plane-sba.yaml
# Open5GS 5G Standalone (5G SA) Service-Based Architecture (SBA) Control Plane
# Includes: NRF, SCP, UDR, UDM, AUSF, PCF, NSSF, BSF, SEPP, AMF (Multi-NIC),
#           SMF (Multi-NIC), ConfigMaps, and Google Cloud Managed Prometheus PodMonitoring
# ==============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: open5gs-common-env
  namespace: open5gs
data:
  PLMN_MCC: "999"
  PLMN_MNC: "70"
  TAC: "1"
  NRF_SBI_URI: "http://open5gs-nrf.open5gs.svc.cluster.local:7777"
  SCP_SBI_URI: "http://open5gs-scp.open5gs.svc.cluster.local:7777"
---
# Dynamic Multi-NIC Dataplane Peer Endpoints (Updated with live GKE Multi-NIC Pod IPs)
apiVersion: v1
kind: ConfigMap
metadata:
  name: open5gs-dataplane-endpoints
  namespace: open5gs
data:
  AMF_N2_ADDRESS: "10.120.0.2"
  UPF_N4_ADDRESS: "10.140.0.35"
  SGWU_SXA_ADDRESS: "10.140.0.4"
---
# Complete Open5GS v2.7.2 SBA Control Plane YAML & freeDiameter Configurations
apiVersion: v1
kind: ConfigMap
metadata:
  name: open5gs-sba-configs
  namespace: open5gs
data:
  nrf.yaml: |
    logger:
      level: info
    global:
      max:
        ue: 1024
    nrf:
      serving:
        - plmn_id:
            mcc: 999
            mnc: 70
      sbi:
        server:
          - dev: eth0
            port: 7777

  scp.yaml: |
    logger:
      level: info
    global:
      max:
        ue: 1024
    scp:
      sbi:
        server:
          - dev: eth0
            port: 7777
        client:
          nrf:
            - uri: http://open5gs-nrf.open5gs.svc.cluster.local:7777

  udr.yaml: |
    logger:
      level: info
    global:
      max:
        ue: 1024
    udr:
      sbi:
        server:
          - dev: eth0
            port: 7777
        client:
          scp:
            - uri: http://open5gs-scp.open5gs.svc.cluster.local:7777

  udm.yaml: |
    logger:
      level: info
    global:
      max:
        ue: 1024
    udm:
      hnet:
        - id: 1
          scheme: 1
          key: /opt/open5gs/etc/open5gs/hnet/curve25519-1.key
        - id: 2
          scheme: 2
          key: /opt/open5gs/etc/open5gs/hnet/secp256r1-2.key
      sbi:
        server:
          - dev: eth0
            port: 7777
        client:
          scp:
            - uri: http://open5gs-scp.open5gs.svc.cluster.local:7777

  ausf.yaml: |
    logger:
      level: info
    global:
      max:
        ue: 1024
    ausf:
      sbi:
        server:
          - dev: eth0
            port: 7777
        client:
          scp:
            - uri: http://open5gs-scp.open5gs.svc.cluster.local:7777

  pcf.yaml: |
    logger:
      level: info
    global:
      max:
        ue: 1024
    pcf:
      sbi:
        server:
          - dev: eth0
            port: 7777
        client:
          scp:
            - uri: http://open5gs-scp.open5gs.svc.cluster.local:7777
      metrics:
        server:
          - dev: eth0
            port: 9090

  nssf.yaml: |
    logger:
      level: info
    global:
      max:
        ue: 1024
    nssf:
      sbi:
        server:
          - dev: eth0
            port: 7777
        client:
          scp:
            - uri: http://open5gs-scp.open5gs.svc.cluster.local:7777
          nsi:
            - uri: http://open5gs-nrf.open5gs.svc.cluster.local:7777
              s_nssai:
                sst: 1
                sd: 010203
            - uri: http://open5gs-nrf.open5gs.svc.cluster.local:7777
              s_nssai:
                sst: 1

  bsf.yaml: |
    logger:
      level: info
    global:
      max:
        ue: 1024
    bsf:
      sbi:
        server:
          - dev: eth0
            port: 7777
        client:
          scp:
            - uri: http://open5gs-scp.open5gs.svc.cluster.local:7777

  sepp1.yaml: |
    logger:
      level: info
    global:
      max:
        ue: 1024
    sepp:
      default:
        tls:
          server:
            private_key: /opt/open5gs/etc/open5gs/tls/sepp1.key
            cert: /opt/open5gs/etc/open5gs/tls/sepp1.crt
          client:
            cacert: /opt/open5gs/etc/open5gs/tls/ca.crt
      sbi:
        server:
          - dev: eth0
            port: 7777
        client:
          scp:
            - uri: http://open5gs-scp.open5gs.svc.cluster.local:7777
      n32:
        server:
          - sender: sepp1.localdomain
            scheme: https
            dev: eth0
            port: 7778

  amf.yaml: |
    logger:
      level: info
    global:
      max:
        ue: 1024
    amf:
      sbi:
        server:
          - dev: eth0
            port: 7777
        client:
          scp:
            - uri: http://open5gs-scp.open5gs.svc.cluster.local:7777
      ngap:
        server:
          - dev: net1
      gtpc:
        server:
          - dev: eth0
      metrics:
        server:
          - dev: eth0
            port: 9090
      guami:
        - plmn_id:
            mcc: 999
            mnc: 70
          amf_id:
            region: 2
            set: 1
      tai:
        - plmn_id:
            mcc: 999
            mnc: 70
          tac: 1
      plmn_support:
        - plmn_id:
            mcc: 999
            mnc: 70
          s_nssai:
            - sst: 1
              sd: 010203
            - sst: 1
      security:
        integrity_order: [NIA2, NIA1, NIA0]
        ciphering_order: [NEA0, NEA1, NEA2]
      network_name:
        full: Open5GS-GCP
        short: O5GS
      amf_name: open5gs-amf0
      time:
        t3512:
          value: 540

  smf.yaml: |
    logger:
      level: info
    global:
      max:
        ue: 1024
    smf:
      sbi:
        server:
          - dev: eth0
            port: 7777
        client:
          scp:
            - uri: http://open5gs-scp.open5gs.svc.cluster.local:7777
      pfcp:
        server:
          - dev: net1
        client:
          upf:
            - address: __UPF_N4_ADDRESS__
              dnn: internet
      gtpc:
        server:
          - dev: eth0
      gtpu:
        server:
          - dev: eth0
      metrics:
        server:
          - dev: eth0
            port: 9090
      session:
        - subnet: 10.45.0.0/16
          gateway: 10.45.0.1
          dnn: internet
      dns:
        - 8.8.8.8
        - 8.8.4.4
      mtu: 1400
      ctf:
        enabled: auto
      freeDiameter: /etc/open5gs-cfg/smf.conf
      info:
        - s_nssai:
            - sst: 1
              sd: 010203
              dnn:
                - internet
            - sst: 1
              dnn:
                - internet

  smf.conf: |
    Identity = "smf.gradiant";
    Realm = "gradiant";
    No_SCTP;
    TLS_Cred = "/opt/open5gs/etc/freeDiameter/smf.cert.pem", "/opt/open5gs/etc/freeDiameter/smf.key.pem";
    TLS_CA = "/opt/open5gs/etc/freeDiameter/cacert.pem";
    LoadExtension = "/opt/open5gs/lib/freeDiameter/dbg_msg_dumps.fdx" : "0x8888";
    LoadExtension = "/opt/open5gs/lib/freeDiameter/dict_rfc5777.fdx";
    LoadExtension = "/opt/open5gs/lib/freeDiameter/dict_mip6i.fdx";
    LoadExtension = "/opt/open5gs/lib/freeDiameter/dict_nasreq.fdx";
    LoadExtension = "/opt/open5gs/lib/freeDiameter/dict_nas_mipv6.fdx";
    LoadExtension = "/opt/open5gs/lib/freeDiameter/dict_dcca.fdx";
    LoadExtension = "/opt/open5gs/lib/freeDiameter/dict_dcca_3gpp.fdx";
    ConnectPeer = "pcrf.gradiant" { ConnectTo = "open5gs-pcrf.open5gs.svc.cluster.local"; Port = 3868; TcTimer = 60; TwTimer = 30; No_TLS; };
---
# 1. NRF (NF Repository Function)
apiVersion: v1
kind: Service
metadata:
  name: open5gs-nrf
  namespace: open5gs
spec:
  selector:
    nf: nrf
  ports:
    - name: http2-sbi
      port: 7777
      targetPort: 7777
      appProtocol: kubernetes.io/h2c
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: open5gs-nrf
  namespace: open5gs
  labels:
    app.kubernetes.io/part-of: open5gs-5gc
    nf: nrf
spec:
  # Single authoritative in-memory NF Registry instance for PLMN 999-70
  replicas: 1
  selector:
    matchLabels:
      nf: nrf
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: open5gs-5gc
        nf: nrf
    spec:
      nodeSelector:
        5g-plane: control-plane-sba
      containers:
        - name: nrfd
          image: docker.io/gradiant/open5gs:2.7.2
          command: ["/bin/bash", "-c", "ulimit -n 65536 && exec open5gs-nrfd -c /etc/open5gs-cfg/nrf.yaml"]
          ports:
            - containerPort: 7777
              name: sbi
          volumeMounts:
            - name: sba-configs
              mountPath: /etc/open5gs-cfg
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "512Mi"
      volumes:
        - name: sba-configs
          configMap:
            name: open5gs-sba-configs
---
