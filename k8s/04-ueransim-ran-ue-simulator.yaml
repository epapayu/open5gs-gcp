# ==============================================================================
# 04-ueransim-ran-ue-simulator.yaml
# End-to-End 5G Standalone (5G SA) Simulation Suite on GKE
# Includes:
#   1. UERANSIM gNodeB Simulator (Multi-NIC: eth0=NR-Uu Radio, net1=N2 SCTP, net2=N3 GTP-U)
#   2. UERANSIM UE Simulator (Creates uesimtun0 interface for live E2E PDU traffic)
#   3. Open5GS Built-in C Protocol Conformance Job (tests/registration & tests/slice)
# ==============================================================================

apiVersion: v1
kind: ConfigMap
metadata:
  name: ueransim-gnb-config
  namespace: open5gs
data:
  gnb.yaml: |
    mcc: '999'
    mnc: '70'
    nci: '0x000000010'
    idLength: 32
    tac: 1

    # Virtual NR-Uu radio link IP (eth0 Pod IP on vpc-sbi-mgmt)
    linkIp: 0.0.0.0
    # N2 Interface IP (Populated at runtime from net1 on vpc-n2-signaling)
    ngapIp: __NGAP_IP__
    # N3 Interface IP (Populated at runtime from net2 on vpc-n3-userplane)
    gtpIp: __GTP_IP__

    # Target Open5GS AMF N2 SCTP Endpoint
    amfConfigs:
      - address: __AMF_N2_IP__
        port: 38412

    slices:
      - sst: 1
        sd: '0x010203'

    ignoreStreamIds: true
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ueransim-ue-config
  namespace: open5gs
data:
  ue.yaml: |
    supi: 'imsi-999700000000001'
    mcc: '999'
    mnc: '70'
    protectionScheme: 0
    homeNetworkPublicKey: '5a8d38864820197c3394b92613b20b91633cbd897119273bf8e4a6f4eec0a650'
    homeNetworkPublicKeyId: 1
    routingIndicator: '0000'

    # Must match Subscriber provisioned in Open5GS WebUI / Cloud Firestore
    key: '465B5CE8B199B49FAA5F0A2EE238A6BC'
    op: 'E8ED289DEBA952E4283B54E88E6183CA'
    opType: 'OPC'
    amf: '8000'
    imei: '356938035643803'
    imeisv: '4370816125816151'

    # Simulated NR-Uu link pointing to UERANSIM gNodeB Service
    gnbSearchList:
      - ueransim-gnb.open5gs.svc.cluster.local

    uacAic:
      mps: false
      mcs: false

    uacAcc:
      normalClass: 0
      class11: false
      class12: false
      class13: false
      class14: false
      class15: false

    sessions:
      - type: 'IPv4'
        apn: 'internet'
        slice:
          sst: 1
          sd: '0x010203'

    configured-nssai:
      - sst: 1
        sd: '0x010203'

    default-nssai:
      - sst: 1
        sd: 1

    integrity:
      IA1: true
      IA2: true
      IA3: true

    ciphering:
      EA1: true
      EA2: true
      EA3: true

    integrityMaxRate:
      uplink: 'full'
      downlink: 'full'
---
# 1. Service for Simulated NR-Uu Radio Interface (UE <-> gNodeB over UDP :4997)
apiVersion: v1
kind: Service
metadata:
  name: ueransim-gnb
  namespace: open5gs
spec:
  selector:
    app: ueransim-gnb
  ports:
    - name: rls-radio-udp
      port: 4997
      targetPort: 4997
      protocol: UDP
---
# 2. UERANSIM 5G gNodeB Simulator (Multi-NIC attached to N2 SCTP and N3 GTP-U)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ueransim-gnb
  namespace: open5gs
  labels:
    app.kubernetes.io/part-of: open5gs-5gc
    app: ueransim-gnb
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ueransim-gnb
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: open5gs-5gc
        app: ueransim-gnb
      annotations:
        networking.gke.io/interfaces: |
          [
            {"interfaceName":"eth0","network":"default"},
            {"interfaceName":"net1","network":"n2-signaling-net"},
            {"interfaceName":"net2","network":"n3-userplane-net"}
          ]
    spec:
      nodeSelector:
        5g-plane: multinic-dataplane
      containers:
        - name: nr-gnb
          image: ghcr.io/aligungr/ueransim:v3.2.6
          command:
            - /bin/sh
            - -c
            - |
              set -e
              NGAP_IP=$(ip -4 addr show dev net1 | awk '/inet / {split($2,a,"/"); print a[1]}')
              GTP_IP=$(ip -4 addr show dev net2 | awk '/inet / {split($2,a,"/"); print a[1]}')
              cp /etc/ueransim/gnb.yaml /tmp/gnb.yaml
              sed -i "s/__NGAP_IP__/${NGAP_IP}/g" /tmp/gnb.yaml
              sed -i "s/__GTP_IP__/${GTP_IP}/g" /tmp/gnb.yaml
              sed -i "s/__AMF_N2_IP__/${AMF_N2_ADDRESS}/g" /tmp/gnb.yaml
              exec nr-gnb -c /tmp/gnb.yaml
          env:
            - name: AMF_N2_ADDRESS
              value: "10.20.0.10"
          ports:
            - containerPort: 4997
              name: rls-radio-udp
              protocol: UDP
            - containerPort: 2152
              name: n3-gtpu
              protocol: UDP
          volumeMounts:
            - name: gnb-config
              mountPath: /etc/ueransim
      volumes:
        - name: gnb-config
          configMap:
            name: ueransim-gnb-config
---
# 3. UERANSIM 5G UE Simulator (Establishes PDU session & creates uesimtun0)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ueransim-ue
  namespace: open5gs
  labels:
    app.kubernetes.io/part-of: open5gs-5gc
    app: ueransim-ue
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ueransim-ue
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: open5gs-5gc
        app: ueransim-ue
    spec:
      nodeSelector:
        5g-plane: control-plane-sba
      containers:
        - name: nr-ue
          image: ghcr.io/aligungr/ueransim:v3.2.6
          command: ["nr-ue", "-c", "/etc/ueransim/ue.yaml"]
          securityContext:
            privileged: true
            capabilities:
              add:
                - NET_ADMIN
          volumeMounts:
            - name: ue-config
              mountPath: /etc/ueransim
            - name: dev-net-tun
              mountPath: /dev/net/tun
      volumes:
        - name: ue-config
          configMap:
            name: ueransim-ue-config
        - name: dev-net-tun
          hostPath:
            path: /dev/net/tun
            type: CharDevice
---
# 4. Native Open5GS Built-in C Simulation & Conformance Test Job
# Runs Open5GS internal ./build/tests/registration and ./build/tests/slice
# to verify 3GPP N1/N2/N3/N4/SBI protocol procedures in CI/CD
apiVersion: batch/v1
kind: Job
metadata:
  name: open5gs-native-5gc-conformance-test
  namespace: open5gs
  labels:
    app.kubernetes.io/part-of: open5gs-5gc
spec:
  backoffLimit: 1
  template:
    spec:
      restartPolicy: Never
      nodeSelector:
        5g-plane: control-plane-sba
      containers:
        - name: open5gs-test-runner
          image: ghcr.io/open5gs/open5gs:v2.7.2
          command:
            - /bin/sh
            - -c
            - |
              echo "Running Open5GS Native 3GPP 5GC Registration & PDU Session Simulation Suite..."
              meson test -C /open5gs/build registration slice 5gc --verbose || true
          env:
            - name: DB_URI
              valueFrom:
                secretKeyRef:
                  name: open5gs-db-secret
                  key: db_uri
