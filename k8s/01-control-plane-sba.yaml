# 5. PCF (Policy Control Function), NSSF (Slice Selection), BSF (Binding), SEPP (Roaming)
apiVersion: v1
kind: Service
metadata:
  name: open5gs-pcf
  namespace: open5gs
spec:
  selector:
    nf: pcf
  ports:
    - name: http2-sbi
      port: 7777
      targetPort: 7777
      appProtocol: kubernetes.io/h2c
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: open5gs-pcf
  namespace: open5gs
spec:
  replicas: 2
  selector:
    matchLabels:
      nf: pcf
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: open5gs-5gc
        nf: pcf
        metrics: enabled
    spec:
      nodeSelector:
        5g-plane: control-plane-sba
      containers:
        - name: pcfd
          image: docker.io/gradiant/open5gs:2.7.2
          command:
            - /bin/bash
            - -c
            - |
              set -e
              ulimit -n 65536
              export DB_URI="$(printf '%s' "${DB_URI}" | sed -E 's#@[^/]+/#@open5gs-firestore-proxy.open5gs.svc.cluster.local:27017/#; s#\?.*#?authSource=admin\&authMechanism=SCRAM-SHA-256\&retryWrites=false#')"
              printf 'db_uri: "%s"\n' "${DB_URI}" > /tmp/pcf.yaml
              cat /etc/open5gs-cfg/pcf.yaml >> /tmp/pcf.yaml
              exec open5gs-pcfd -c /tmp/pcf.yaml
          env:
            - name: DB_URI
              valueFrom:
                secretKeyRef:
                  name: open5gs-db-secret
                  key: db_uri
          ports:
            - containerPort: 7777
              name: sbi
            - containerPort: 9090
              name: metrics
          volumeMounts:
            - name: sba-configs
              mountPath: /etc/open5gs-cfg
      volumes:
        - name: sba-configs
          configMap:
            name: open5gs-sba-configs
